name: Keyless Terraform Deploy
on:
  push:
    branches:
      - main
# REQUIRED FOR OIDC FEDERATION
permissions:
  id-token: write 
  contents: read 
jobs:
  terraform_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

# DEBUG STEP: Prints the actual sub claim GitHub sends
      - name: Inspect OIDC Subject Claim
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== ACTUAL OIDC SUB CLAIM BELOW ==="
          jq -R 'split(".") | .[1] | @base64d | fromjson' <<< "$TOKEN"
          echo "==================================="

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::954959707354:role/Web_Identity
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -auto-approve
